name = "alpaca-trading-bot"
main = "src/index.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "alpaca-trading-bot"
database_id = "2bc505a2-d744-4322-8c3b-5f5ebe35f9a1"

# Cron triggers:
# 1. Daytrading: every 5 minutes during US market hours (13-21 UTC, Mon-Fri)
# 2. Swing: once daily after market close (22:00 UTC = after 16:00 ET close)
[triggers]
crons = ["*/5 13-21 * * 1-5", "0 22 * * 1-5"]

# Secrets (set via wrangler secret put or dashboard):
# ALPACA_API_KEY
# ALPACA_API_SECRET
# ALPACA_BASE_URL  (paper: https://paper-api.alpaca.markets)
# LLM_API_KEY      (for AI refinement layer)
